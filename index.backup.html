<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mother's Hut - Order System</title>
    <!-- Plus Jakarta Sans Font for clean, modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', '-apple-system', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            red: '#e11d48', // Dine-In active button red
                            orange: '#f97316', // Category header orange
                            dark: '#1e293b' // Dark buttons (Menu, Chat)
                        }
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-[#fcfcfc] text-slate-900 font-sans antialiased min-h-screen pb-24 relative">

    <!-- TOP NAVBAR -->
    <header class="bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between sticky top-0 z-40">
        <!-- Logo & Title -->
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-gray-200 rounded-full overflow-hidden flex items-center justify-center">
                <!-- Generic avatar/logo placeholder -->
                <img src="https://ui-avatars.com/api/?name=MH&background=fde047&color=1e293b" alt="Logo" class="w-full h-full object-cover">
            </div>
            <span class="text-base font-semibold tracking-tight">Mother's Hut</span>
        </div>

        <!-- Right Nav -->
        <div class="flex items-center gap-6 text-sm font-medium text-slate-700">
            <a href="#" class="hover:text-black">Home</a>
            <a href="#" class="hover:text-black">Menu</a>
            <button class="p-2 hover:bg-gray-50 rounded-full">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
            </button>
            <button class="flex items-center gap-2 border border-gray-200 rounded-full px-4 py-1.5 hover:bg-gray-50">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                Guest
                <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
        </div>
    </header>

    <!-- SECONDARY NAVBAR (Order Types & Language) -->
    <div class="px-6 py-4 flex items-center justify-between max-w-[1440px] mx-auto">
        <!-- Delivery Toggles -->
        <div class="flex p-1 bg-white border border-gray-200 rounded-full shadow-sm">
            <button class="px-6 py-1.5 text-sm font-semibold bg-brand-red text-white rounded-full">Dine-In</button>
            <button class="px-6 py-1.5 text-sm font-medium text-slate-600 rounded-full hover:bg-gray-50">Pickup</button>
            <button class="px-6 py-1.5 text-sm font-medium text-slate-600 rounded-full hover:bg-gray-50">Delivery</button>
        </div>
        <!-- Language Toggle -->
        <div class="flex items-center bg-brand-dark text-white rounded-full p-1 shadow-sm">
            <button class="px-3 py-1 text-xs font-semibold bg-brand-dark rounded-full">EN</button>
            <button class="px-3 py-1 text-xs font-medium bg-white text-brand-dark rounded-full">বাং</button>
        </div>
    </div>

    <!-- SEARCH & MENU BUTTON -->
    <div class="px-6 pb-4 flex items-center gap-4 max-w-[1440px] mx-auto">
        <div class="relative flex-1">
            <svg class="w-4 h-4 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 103.5 10.5a7.5 7.5 0 0013.15 6.15z"></path></svg>
            <input type="text" id="searchInput" class="w-full pl-11 pr-4 py-2.5 bg-white border border-gray-200 rounded-full text-sm focus:outline-none focus:border-gray-300 shadow-sm transition-colors" placeholder="Search for dishes...">
        </div>
        <button class="flex items-center gap-2 bg-brand-dark text-white px-8 py-2.5 rounded-full text-sm font-semibold hover:bg-slate-800 shadow-sm shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            Menu
        </button>
    </div>

    <!-- FILTER TAGS -->
    <div class="px-6 pb-6 flex gap-2 max-w-[1440px] mx-auto">
        <button class="px-4 py-1.5 text-xs font-semibold bg-brand-dark text-white rounded-full">All</button>
        <button class="flex items-center gap-1.5 px-4 py-1.5 text-xs font-semibold bg-white border border-green-500 text-green-700 rounded-full hover:bg-green-50">
            <div class="w-2.5 h-2.5 border border-green-600 rounded-sm flex items-center justify-center"><div class="w-1.5 h-1.5 bg-green-600 rounded-full"></div></div>
            Veg
        </button>
        <button class="flex items-center gap-1.5 px-4 py-1.5 text-xs font-semibold bg-white border border-red-500 text-red-700 rounded-full hover:bg-red-50">
            <div class="w-2.5 h-2.5 border border-red-600 rounded-sm flex items-center justify-center"><div class="w-0 h-0 border-l-[3px] border-r-[3px] border-b-[4px] border-l-transparent border-r-transparent border-b-red-600"></div></div>
            Non-Veg
        </button>
    </div>

    <!-- MAIN MENU CONTENT -->
    <main class="max-w-[1440px] mx-auto px-6" id="menuContainer">
        <!-- JS will dynamically populate category headers and grid rows here -->
        <p class="text-sm text-slate-500">Loading catalog...</p>
    </main>

    <!-- FLOATING CHATBOT WIDGET -->
    <div class="fixed bottom-6 right-6 z-50 flex flex-col items-end">
        
        <!-- Chat Window Panel (Hidden by default) -->
        <div id="chatWindow" class="hidden w-[340px] sm:w-[380px] h-[500px] bg-white border border-gray-200 shadow-2xl rounded-2xl flex flex-col mb-4 overflow-hidden origin-bottom-right transition-all">
            <!-- Header -->
            <div class="bg-brand-dark text-white px-5 py-4 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    <span class="text-sm font-semibold tracking-wide">AI Assistant</span>
                </div>
                <button id="closeChatBtn" class="text-gray-300 hover:text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <!-- Chat History -->
            <div id="chatHistory" class="flex-1 bg-slate-50 p-4 overflow-y-auto flex flex-col gap-4">
                <div class="max-w-[85%] px-4 py-3 bg-white border border-gray-200 text-slate-800 text-sm rounded-2xl rounded-tl-sm self-start shadow-sm">
                    Hello! I'm your Mother's Hut AI assistant. Looking for a specific dish, price, or recommendation today?
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-3 bg-white border-t border-gray-200 flex items-center gap-2 shrink-0">
                <input type="text" id="chatInput" class="flex-1 bg-gray-100 border-transparent rounded-full px-4 py-2.5 text-sm focus:outline-none focus:bg-white focus:border-brand-dark focus:ring-1 focus:ring-brand-dark transition-all" placeholder="Ask about the menu...">
                <button id="sendBtn" class="w-10 h-10 bg-brand-dark text-white rounded-full flex items-center justify-center hover:bg-slate-800 transition-colors shrink-0 disabled:opacity-50">
                    <svg class="w-4 h-4 translate-x-px translate-y-px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V6m0 0l-7 7m7-7l7 7"></path></svg>
                </button>
            </div>
        </div>

        <!-- Chat Widget Toggle FAB -->
        <button id="chatToggleBtn" class="w-14 h-14 bg-brand-dark text-white rounded-full shadow-xl flex items-center justify-center hover:scale-105 transition-transform">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
        </button>
    </div>

    <script>
        const BACKEND_URL = "http://127.0.0.1:8000";
        let fullMenu = [];

        const menuContainer = document.getElementById("menuContainer");
        const searchInput = document.getElementById("searchInput");
        
        // Chat elements
        const chatWindow = document.getElementById("chatWindow");
        const chatToggleBtn = document.getElementById("chatToggleBtn");
        const closeChatBtn = document.getElementById("closeChatBtn");
        const chatHistory = document.getElementById("chatHistory");
        const chatInput = document.getElementById("chatInput");
        const sendBtn = document.getElementById("sendBtn");

        // UI SVG Icons based on screenshot
        const vegIcon = `<div class="w-3 h-3 border border-green-600 rounded-sm flex items-center justify-center mr-2 mt-0.5 shrink-0"><div class="w-[6px] h-[6px] bg-green-600 rounded-full"></div></div>`;
        const nonVegIcon = `<div class="w-3 h-3 border border-red-600 rounded-sm flex items-center justify-center mr-2 mt-0.5 shrink-0"><div class="w-0 h-0 border-l-[3px] border-r-[3px] border-b-[4px] border-l-transparent border-r-transparent border-b-red-600"></div></div>`;
        const optionsHandIcon = `<svg class="w-3.5 h-3.5 text-brand-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>`;

        // Parse single JSON item into structured data
        function parseMenuItem(item) {
            const rawText = item.text || "";
            const category = item.metadata?.category || "General";
            const escapedCategory = category.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const cleanText = rawText.replace(new RegExp(`Category:\\s*${escapedCategory}\\.\\s*`, "i"), "");

            let title = cleanText;
            let desc = "";
            let price = "";
            
            // Extract Price if standard format "Price is X Rupees."
            const priceMatch = cleanText.match(/Price is (\d+)/i);
            if (priceMatch) {
                price = priceMatch[1];
                title = cleanText.replace(/Price is \d+ Rupees\./i, "").trim();
            }

            const splitIndex = title.indexOf(":");
            if (splitIndex !== -1) {
                desc = title.substring(splitIndex + 1).trim();
                title = title.substring(0, splitIndex).trim();
            }

            // Pseudo-logic to assign veg/non-veg based on text for UI fidelity
            const isNonVeg = title.toLowerCase().includes("chicken") || title.toLowerCase().includes("mutton") || title.toLowerCase().includes("fish") || title.toLowerCase().includes("egg");
            const icon = isNonVeg ? nonVegIcon : vegIcon;

            return { category, title, desc, price, icon };
        }

        // Render the exact UI from the screenshot
        function renderMenuUI(items) {
            menuContainer.innerHTML = "";

            if (items.length === 0) {
                menuContainer.innerHTML = `<div class="py-12 text-center text-sm text-slate-500">No items found matching your search.</div>`;
                return;
            }

            // Group items by category
            const grouped = items.reduce((acc, item) => {
                const parsed = parseMenuItem(item);
                if (!acc[parsed.category]) acc[parsed.category] = [];
                acc[parsed.category].push(parsed);
                return acc;
            }, {});

            // Build layout per category
            for (const [category, categoryItems] of Object.entries(grouped)) {
                
                // 1. Category Header (Orange Bar)
                const header = document.createElement("div");
                header.className = "bg-brand-orange text-white rounded-lg px-4 py-2.5 mb-5 flex items-center gap-2 mt-6";
                header.innerHTML = `
                    <div class="bg-white/20 p-1 rounded">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    </div>
                    <h2 class="text-sm font-bold uppercase tracking-wider">${category}</h2>
                `;
                menuContainer.appendChild(header);

                // 2. Grid Container for Category
                const grid = document.createElement("div");
                grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6";

// 3. Render Cards
                categoryItems.forEach((item, index) => {
                    
                    // Your authentic Mother's Hut image URLs
                    const authenticImages = [
                        "https://mothershut.com/uploads/menu/ITEM_2302_1772280809.webp",
                        "https://mothershut.com/uploads/menu/ITEM_2590_1780157472.webp",
                        "https://mothershut.com/uploads/menu/ITEM_2285_1780134790.webp",
                        "https://mothershut.com/uploads/menu/ITEM_3001_1783415995.webp"
                    ];
                    
                    // Rotate through your real images so they show up consistently
                    const imageUrl = authenticImages[index % authenticImages.length];

                    const card = document.createElement("div");
                    card.className = "bg-white border border-gray-200 rounded-xl p-4 flex gap-4 shadow-sm hover:shadow-md transition-shadow";
                    
                    // Construct left text column and right image column exactly as image
                    card.innerHTML = `
                        <!-- Left Content -->
                        <div class="flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex items-start">
                                    ${item.icon}
                                    <h3 class="text-[15px] font-semibold text-slate-800 leading-tight mb-1">${item.title}</h3>
                                </div>
                                <div class="text-[15px] font-semibold text-slate-800 mb-2">₹${item.price || "0"}</div>
                                <p class="text-xs text-gray-400 line-clamp-2 leading-relaxed pr-2">${item.desc}</p>
                            </div>
                        </div>
                        
                        <!-- Right Image & Button -->
                        <div class="w-[110px] h-[110px] shrink-0 relative rounded-xl bg-gray-100 overflow-hidden shadow-inner">
                            <!-- Using your real Mother's Hut images -->
                            <img src="${imageUrl}" alt="${item.title}" class="w-full h-full object-cover">
                            
                            <!-- Absolute Options Button overlapping bottom -->
                            <button class="absolute -bottom-1 left-1/2 -translate-x-1/2 bg-white border border-gray-200 shadow-md rounded-md px-3 py-1 flex items-center gap-1 w-max z-10 hover:bg-gray-50 transition-colors">
                                ${optionsHandIcon}
                                <span class="text-[10px] font-bold text-brand-red uppercase">Options</span>
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                menuContainer.appendChild(grid);
            }
        }

        // Search Filter Logic
        function applyFilters() {
            const query = searchInput.value.trim().toLowerCase();
            if (!query) {
                renderMenuUI(fullMenu);
                return;
            }
            const filtered = fullMenu.filter(item => {
                const textMatch = (item.text || "").toLowerCase().includes(query);
                const categoryMatch = (item.metadata?.category || "").toLowerCase().includes(query);
                return textMatch || categoryMatch;
            });
            renderMenuUI(filtered);
        }

        // Fetch Initial Data
        async function loadMenu() {
            try {
                const response = await fetch(`${BACKEND_URL}/menu`);
                if (!response.ok) throw new Error("Network response was not ok");
                fullMenu = await response.json();
                renderMenuUI(fullMenu);
            } catch (error) {
                menuContainer.innerHTML = `<div class="p-6 bg-red-50 text-red-700 rounded-lg border border-red-200">Failed to load menu data. Ensure backend is running.</div>`;
            }
        }

        // ---- CHATBOT WIDGET LOGIC ----
        
        // Toggle window
        function toggleChat() {
            chatWindow.classList.toggle("hidden");
            if (!chatWindow.classList.contains("hidden")) {
                chatInput.focus();
            }
        }
        chatToggleBtn.addEventListener("click", toggleChat);
        closeChatBtn.addEventListener("click", toggleChat);

        // Append message to UI
        function addChatMessage(text, sender) {
            const msgDiv = document.createElement("div");
            
            if (sender === "user") {
                msgDiv.className = "max-w-[85%] px-4 py-2.5 bg-brand-dark text-white text-sm rounded-2xl rounded-tr-sm self-end shadow-sm leading-relaxed";
            } else if (sender === "loading") {
                msgDiv.className = "max-w-[85%] px-4 py-2.5 bg-gray-100 text-gray-500 text-sm rounded-2xl rounded-tl-sm self-start italic";
            } else {
                msgDiv.className = "max-w-[85%] px-4 py-2.5 bg-white border border-gray-200 text-slate-800 text-sm rounded-2xl rounded-tl-sm self-start shadow-sm leading-relaxed";
            }

            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return msgDiv;
        }

        // Send logic to backend
        async function sendChatMessage() {
            const question = chatInput.value.trim();
            if (!question || sendBtn.disabled) return;

            addChatMessage(question, "user");
            chatInput.value = "";
            sendBtn.disabled = true;

            const loadingNode = addChatMessage("Let me check the menu...", "loading");

            try {
                const response = await fetch(`${BACKEND_URL}/ask`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question })
                });

                if (!response.ok) throw new Error("API Error");
                const data = await response.json();
                
                chatHistory.removeChild(loadingNode);
                addChatMessage(data.answer, "bot");
            } catch (error) {
                chatHistory.removeChild(loadingNode);
                addChatMessage("Unable to reach the server. Please ensure backend is running.", "bot");
            } finally {
                sendBtn.disabled = false;
                chatInput.focus();
            }
        }

        sendBtn.addEventListener("click", sendChatMessage);
        chatInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendChatMessage();
        });

        // Initialize Listeners
        searchInput.addEventListener("input", applyFilters);

        // Boot
        loadMenu();
    </script>
</body>
</html>
